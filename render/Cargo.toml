[package]
name = "svg2tgs-render"
description = "Рендер для превью и проверок: TGS через rlottie (движок Telegram), SVG через resvg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"
links = "rlottie"

[features]
default = ["rlottie"]
# rlottie (C++) для TGS-превью и проверок. Без него остаётся только
# render_svg — так рендер собирается в WebAssembly для веб-версии.
rlottie = []
# По умолчанию собирается rlottie от Samsung (MIT). С этим флагом — форк
# Telegram Desktop (LGPL-2.1), тот же движок, что в клиенте Telegram.
# Подробности и выбор — render/vendor/README.md.
telegram-rlottie = ["rlottie"]

[dependencies]
svg2tgs-core.workspace = true
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
flate2 = "1"
thiserror.workspace = true

[dev-dependencies]
svg2tgs-trace.workspace = true

[build-dependencies]
cc = "1.2"

[[test]]
name = "pixel"
required-features = ["rlottie"]

[[test]]
name = "web_font"
required-features = ["rlottie"]

[[example]]
name = "corpus"
required-features = ["rlottie"]

[[example]]
name = "trace_corpus"
required-features = ["rlottie"]
