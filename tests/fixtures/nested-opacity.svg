<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Итоговая прозрачность круга: 0.5 × 0.5 = 0.25 -->
  <rect width="100" height="100" fill="#ffffff"/>
  <g opacity="0.5">
    <circle cx="50" cy="50" r="40" fill="#000000" opacity="0.5"/>
  </g>
  <!-- Прозрачность группы с перекрытием: перекрытие не должно быть темнее -->
  <g opacity="0.6">
    <rect x="10" y="10" width="40" height="40" fill="#2f81f7"/>
    <rect x="30" y="30" width="40" height="40" fill="#2f81f7"/>
  </g>
</svg>
