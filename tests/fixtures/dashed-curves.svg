<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" fill="none" stroke-linecap="round">
  <!-- Пунктир на кривых: rlottie неточно меряет длину дуг, и штрихи уплывают,
       поэтому конвертер нарезает пунктир сам -->
  <circle cx="36" cy="30" r="22" stroke="#2f81f7" stroke-width="3" stroke-dasharray="7 4" stroke-dashoffset="2"/>
  <!-- Бусины: штрихи нулевой длины со скруглёнными концами -->
  <path d="M10 62c10-10 42-10 52 0" stroke="#e8505b" stroke-width="4" stroke-dasharray="0,6.5"/>
</svg>
