[workspace]
resolver = "2"
members = ["core", "cli", "app/src-tauri"]
default-members = ["core", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Ax1oMgg/svg2tgs"
authors = ["Ax1oMgg"]

[workspace.dependencies]
svg2tgs-core = { path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
