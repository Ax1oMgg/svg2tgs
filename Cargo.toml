[workspace]
resolver = "2"
members = ["core", "render", "publish", "cli", "web", "app/src-tauri"]
default-members = ["core", "render", "publish", "cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Ax1oMgg/svg2tgs"
authors = ["Парамонов Григорий aka Ax1oMgg <chajnayaaxioma@gmail.com>"]

[workspace.dependencies]
svg2tgs-core = { path = "core" }
svg2tgs-render = { path = "render" }
svg2tgs-publish = { path = "publish" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Веб-версия: модуль WebAssembly скачивается в браузер, размер важнее
# скорости (`cargo build -p svg2tgs-web --target wasm32-unknown-unknown --profile web`).
[profile.web]
inherits = "release"
opt-level = "s"
