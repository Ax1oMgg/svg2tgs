# Известные уязвимости в зависимостях: Rust — по базе RustSec (cargo audit),
# интерфейс — по базе npm (npm audit, только то, что попадает в программу).
# Раз в неделю — и без изменений в коде: новые уязвимости находят в старых версиях.
name: Уязвимости

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # понедельник, 09:17 по Москве
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Зависимости
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # Уязвимость — ошибка. Предупреждения (библиотека заброшена, «unsound»)
      # видны в журнале, но проверку не роняют: их почти все приносит Tauri
      # для Linux, исправляются они обновлением Tauri.
      - name: Rust (cargo audit)
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Интерфейс (npm audit)
        working-directory: app
        run: npm audit --omit=dev
