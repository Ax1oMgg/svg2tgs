# Проверки для каждого PR и для main: формат, clippy, тесты, сборка интерфейса.
# macOS здесь не запускается: в приватном репозитории его минуты дороже в 10 раз,
# он собирается при выпуске (release.yml).
name: Проверки

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Библиотеки для Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Интерфейс
        working-directory: app
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Формат
        if: runner.os == 'Linux'
        shell: bash
        run: cargo fmt --all --check 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}

      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}

      - name: Тесты
        shell: bash
        run: cargo test --workspace 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}

      # Журнал ошибки — комментарием в PR: так его видно и без доступа к Actions.
      - name: Журнал ошибки в PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Проверки упали: ${{ matrix.name }}"
            echo
            echo '```'
            grep -v '^\s*\(Compiling\|Checking\|Downloaded\|Downloading\|Fresh\)' ci.log 2>/dev/null | grep -v ' \.\.\. ok$' | tail -n 200
            echo '```'
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
