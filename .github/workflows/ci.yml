# Проверки для каждого PR и для main: формат, clippy, тесты, сборка интерфейса.
# macOS здесь не запускается: в приватном репозитории его минуты дороже в 10 раз,
# он собирается при выпуске (release.yml).
name: Проверки

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Библиотеки для Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev fonts-dejavu-core

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Интерфейс
        working-directory: app
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Формат
        if: runner.os == 'Linux'
        shell: bash
        run: cargo fmt --all --check 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}

      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}

      - name: Тесты
        shell: bash
        run: cargo test --workspace 2>&1 | tee -a ci.log; exit ${PIPESTATUS[0]}

      # Журнал ошибки — комментарием в PR: так его видно и без доступа к Actions.
      # В PR из форков токен только для чтения и комментарий не оставить, поэтому
      # там шаг пропускается (журнал виден в самой проверке), а сбой комментария
      # не заслоняет настоящую ошибку.
      - name: Журнал ошибки в PR
        if: >-
          failure() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Проверки упали: ${{ matrix.name }}"
            echo
            echo '```'
            grep -v '^\s*\(Compiling\|Checking\|Downloaded\|Downloading\|Fresh\)' ci.log 2>/dev/null | grep -v ' \.\.\. ok$' | tail -n 200
            echo '```'
          } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
