# Выпуск: черновик релиза с установщиками для всех ОС.
# Запуск — меткой vX.Y.Z или кнопкой Actions → «Выпуск» → Run workflow.
# Порядок выпуска — docs/RELEASE.md. Опубликовать черновик — вручную на GitHub.
name: Выпуск

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Что собрать"
        type: choice
        options: [все, windows, macos, linux]
        default: все

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  prepare:
    name: Черновик релиза
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Версия
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          tag="v$ver"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Метка $GITHUB_REF_NAME, а в Cargo.toml версия $ver"
              exit 1
            fi
          else
            # Ручной запуск: метка ставится на этот коммит. Уже
            # опубликованную версию не трогаем — сначала поднимите номер.
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
              echo "::error::Версия $ver уже опубликована. Поднимите номер в Cargo.toml и app/package.json."
              exit 1
            fi
            git tag -f "$tag"
            git push -f origin "refs/tags/$tag"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Создать черновик
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 || \
          gh release create "$tag" --draft --verify-tag --title "svg2tgs ${{ steps.v.outputs.version }}" \
            --notes-file .github/release-notes.md

      - name: Что собирать
        id: m
        run: |
          all='[{"name":"Windows","os":"windows-latest","kind":"windows"},{"name":"Windows, офлайн","os":"windows-latest","kind":"windows-offline"},{"name":"macOS","os":"macos-latest","kind":"macos"},{"name":"Linux","os":"ubuntu-22.04","kind":"linux"}]'
          case "${{ inputs.platforms || 'все' }}" in
            windows) f='startswith("windows")' ;;
            macos)   f='. == "macos"' ;;
            linux)   f='. == "linux"' ;;
            *)       f='true' ;;
          esac
          echo "matrix={\"include\":$(echo "$all" | jq -c "[.[] | select(.kind | $f)]")}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      VER: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Библиотеки для Tauri (Linux)
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.kind == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.kind }}

      - name: Зависимости интерфейса
        working-directory: app
        run: npm ci 2>&1 | tee -a ../build.log; exit ${PIPESTATUS[0]}

      - name: Установщик
        working-directory: app
        run: |
          case "${{ matrix.kind }}" in
            windows)         args="--bundles nsis" ;;
            windows-offline) args="--bundles nsis --config src-tauri/tauri.windows-offline.conf.json" ;;
            macos)           args="--bundles dmg --target universal-apple-darwin" ;;
            linux)           args="--bundles deb,appimage" ;;
          esac
          npm run tauri build -- $args 2>&1 | tee -a ../build.log; exit ${PIPESTATUS[0]}

      - name: Командная строка
        if: matrix.kind != 'windows-offline'
        run: |
          {
            case "${{ matrix.kind }}" in
              macos)
                cargo build --release -p svg2tgs-cli --target aarch64-apple-darwin &&
                cargo build --release -p svg2tgs-cli --target x86_64-apple-darwin &&
                lipo -create -output svg2tgs \
                  target/aarch64-apple-darwin/release/svg2tgs target/x86_64-apple-darwin/release/svg2tgs ;;
              *)
                cargo build --release -p svg2tgs-cli ;;
            esac
          } 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Собрать файлы релиза
        run: |
          mkdir -p dist
          b=target/release/bundle
          case "${{ matrix.kind }}" in
            windows)
              cp "$b"/nsis/*-setup.exe "dist/svg2tgs_${VER}_windows_x64-setup.exe"
              cp target/release/svg2tgs.exe dist/ && cp LICENSE THIRD_PARTY_NOTICES.md dist/
              (cd dist && 7z a "svg2tgs-cli_${VER}_windows_x64.zip" svg2tgs.exe LICENSE THIRD_PARTY_NOTICES.md && rm svg2tgs.exe LICENSE THIRD_PARTY_NOTICES.md) ;;
            windows-offline)
              cp "$b"/nsis/*-setup.exe "dist/svg2tgs_${VER}_windows_x64-offline-setup.exe" ;;
            macos)
              cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "dist/svg2tgs_${VER}_macos_universal.dmg"
              tar czf "dist/svg2tgs-cli_${VER}_macos_universal.tar.gz" svg2tgs LICENSE THIRD_PARTY_NOTICES.md ;;
            linux)
              cp "$b"/deb/*.deb "dist/svg2tgs_${VER}_linux_amd64.deb"
              cp "$b"/appimage/*.AppImage "dist/svg2tgs_${VER}_linux_amd64.AppImage"
              tar czf "dist/svg2tgs-cli_${VER}_linux_x86_64.tar.gz" -C target/release svg2tgs -C "$GITHUB_WORKSPACE" LICENSE THIRD_PARTY_NOTICES.md ;;
          esac
          ls -la dist

      - name: Загрузить в релиз
        run: |
          gh release upload "$TAG" dist/* --clobber
          gh release delete-asset "$TAG" "build-log-${{ matrix.kind }}.txt" -y 2>/dev/null || true

      # Журнал сборки — в черновик релиза: так причину видно и без доступа
      # к журналам Actions. После успешной сборки он удаляется.
      - name: Журнал ошибки в черновик
        if: failure()
        run: |
          grep -v -E '^\s*(Compiling|Checking|Downloaded|Downloading|Fresh) ' build.log 2>/dev/null | tail -n 300 > "build-log-${{ matrix.kind }}.txt" || true
          gh release upload "$TAG" "build-log-${{ matrix.kind }}.txt" --clobber

  checksums:
    name: Контрольные суммы
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: SHA-256 всех файлов
        run: |
          mkdir files && cd files
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'svg2tgs*'
          sha256sum svg2tgs* > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
