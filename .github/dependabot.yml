# Dependabot сам предлагает PR с обновлениями. Шаги сборки закреплены
# по хешам коммитов — он обновляет и хеш, и комментарий с версией.
# Обновления собраны в группы, чтобы приходил один PR на экосистему, а не десяток.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Сборка"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # usvg и resvg обновляются только вместе: resvg тянет usvg своей версии,
      # и по отдельности типы ядра и рендера не сходятся. Декодеры картинок
      # трассировки (крейт `trace`) — те же версии, что у resvg: с ним же.
      resvg:
        patterns: ["usvg", "resvg", "png", "zune-jpeg", "zune-core", "image-webp"]
      rust:
        update-types: [minor, patch]
    commit-message:
      prefix: "Rust"

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      npm:
        update-types: [minor, patch]
    commit-message:
      prefix: "Интерфейс"
